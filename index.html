<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Caixa de Sugestões</title>

  <style>

  /* =====================================================
     FUNDO TRANSPARENTE
     ===================================================== */

  html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: transparent !important;
  }

  body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #e5e5f4 !important;
}

  * {
    box-sizing: border-box;
  }


  /* =====================================================
     CONTAINER
     ===================================================== */

.container {
  width: 100%;
  height: 100%;

  margin: 0;
  padding: 10px 16px 12px;

  display: flex;
  flex-direction: column;

  background: #e5e5f4 !important;
}


  /* =====================================================
     FAIXA "SUGESTÕES"
     ===================================================== */

  .cabecalho {
    position: relative;

    width: 72%;
    height: 34px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding-left: 22px;

    margin-bottom: 14px;

    background: #17005c;

    border-radius: 20px;

    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 15px;
    font-weight: 700;

    text-transform: uppercase;

    /* cria o detalhe rosa atrás da faixa */
    box-shadow: 5px 0 0 #d50050;
  }


  /* =====================================================
     TÍTULO
     ===================================================== */

  .titulo {
    display: flex;
    align-items: center;

    gap: 7px;

    margin: 0 0 4px 0;

    color: #17005c;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 18px;
    font-weight: 700;

    line-height: 1.15;
  }


  .titulo .icone {
    display: flex;
    align-items: center;

    font-size: 18px;
    line-height: 1;
  }


  /* =====================================================
     SUBTÍTULO
     ===================================================== */

  .subtitulo {
    margin: 0 0 10px 0;

    color: #555555;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 12px;

    line-height: 1.2;
  }


  /* =====================================================
     FORMULÁRIO
     ===================================================== */

  #formulario {
    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;
  }


  /* =====================================================
     CAIXA DE TEXTO
     ===================================================== */

  textarea {
    width: 100%;

    flex: 1;

    min-height: 70px;

    resize: none;

    padding: 12px 13px;

    border: 1px solid #d8d5e4;

    border-radius: 10px;

    outline: none;

    background: rgba(255, 255, 255, 0.35) !important;

    color: #333333;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 12px;

    line-height: 1.4;

    transition:
      border-color 0.2s ease,
      background 0.2s ease,
      box-shadow 0.2s ease;
  }


  textarea::placeholder {
    color: #888888;
  }


  textarea:focus {
    border-color: #17005c;

    background: rgba(255, 255, 255, 0.55) !important;

    box-shadow: 0 0 0 2px rgba(23, 0, 92, 0.08);
  }


  /* =====================================================
     RODAPÉ
     ===================================================== */

  .rodape {
    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 10px;

    flex-shrink: 0;
  }


  /* =====================================================
     CONTADOR
     ===================================================== */

  .contador {
    color: #666666;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 10px;

    white-space: nowrap;
  }


  /* =====================================================
     BOTÃO
     ===================================================== */

  button {
    position: relative;

    border: none;

    border-radius: 9px;

    padding: 9px 17px;

    background: #17005c;

    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;

    white-space: nowrap;

    /* pequeno detalhe rosa igual ao restante da página */
    box-shadow: 4px 0 0 #d50050;

    transition:
      transform 0.15s ease,
      opacity 0.15s ease;
  }


  button:hover {
    opacity: 0.92;

    transform: translateY(-1px);
  }


  button:active {
    transform: translateY(0);
  }


  button:disabled {
    opacity: 0.55;

    cursor: wait;

    transform: none;
  }


  /* =====================================================
     MENSAGEM
     ===================================================== */

  #mensagem {
    min-height: 14px;

    margin-top: 4px;

    color: #17005c;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 10px;

    font-weight: 600;
  }


  /* =====================================================
     IFRAME INVISÍVEL
     ===================================================== */

  #envio {
    display: none;
  }

</style>

</head>

<body>

  <div class="container">

  <div class="cabecalho">
    SUGESTÕES
  </div>

  <div class="titulo">
    <span class="icone">💡</span>
    <span>Tem uma sugestão?</span>
  </div>

  <div class="subtitulo">
    Escreva sua sugestão abaixo e envie para nós.
  </div>

  <form
    id="formulario"
    method="POST"
    action="SUA_URL_DO_APPS_SCRIPT"
    target="envio"
  >

    <textarea
      id="sugestao"
      name="sugestao"
      maxlength="1000"
      placeholder="Digite sua sugestão aqui..."
      required
    ></textarea>

    <div class="rodape">

      <div
        class="contador"
        id="contador"
      >
        0 / 1000
      </div>

      <button
        type="submit"
        id="botao"
      >
        Enviar sugestão
      </button>

    </div>

  </form>

  <iframe
    name="envio"
    id="envio"
  ></iframe>

  <div id="mensagem"></div>

</div>

  <div class="subtitulo">
    Escreva sua sugestão abaixo e envie para nós.
  </div>

    <form
  id="formulario"
  method="POST"
  action="https://script.google.com/a/macros/latam.com/s/AKfycbyh-t9jOQSH_VepJkA5rpr0MxQ8zIR88tVr34YH1kejIfyuOBKNVaOMYK6pXT7jtjcS/exec"
  target="envio"
>

      <textarea
        id="sugestao"
        name="sugestao"
        maxlength="1000"
        placeholder="Digite sua sugestão aqui..."
        required
      ></textarea>

      <div class="rodape">

        <div
          class="contador"
          id="contador"
        >
          0 / 1000
        </div>

        <button
          type="submit"
          id="botao"
        >
          Enviar sugestão
        </button>

      </div>

    </form>

    <iframe
      name="envio"
      id="envio"
    ></iframe>

    <div id="mensagem"></div>

  </div>


  <script>

    const formulario =
      document.getElementById('formulario');

    const campo =
      document.getElementById('sugestao');

    const contador =
      document.getElementById('contador');

    const botao =
      document.getElementById('botao');

    const mensagem =
      document.getElementById('mensagem');


    campo.addEventListener(
      'input',
      function() {

        contador.textContent =
          campo.value.length + ' / 1000';

      }
    );


    formulario.addEventListener(
      'submit',
      function() {

        botao.disabled = true;

        botao.textContent =
          'Enviando...';

        mensagem.textContent = '';

        setTimeout(
          function() {

            campo.value = '';

            contador.textContent =
              '0 / 1000';

            botao.disabled = false;

            botao.textContent =
              'Enviar sugestão';

            mensagem.textContent =
              'Sugestão enviada com sucesso!';

          },
          1200
        );

      }
    );


    window.addEventListener(
      'message',
      function(event) {

        if (
          event.data ===
          'sugestao_enviada'
        ) {

          campo.value = '';

          contador.textContent =
            '0 / 1000';

          botao.disabled = false;

          botao.textContent =
            'Enviar sugestão';

          mensagem.textContent =
            'Sugestão enviada com sucesso!';

        }

      }
    );

  </script>

</body>

</html>
