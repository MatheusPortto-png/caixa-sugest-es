<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Caixa de Sugestões</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: transparent;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    .titulo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .subtitulo {
      font-size: 14px;
      color: #666;
      margin-bottom: 14px;
    }

    textarea {
      width: 100%;
      min-height: 120px;

      resize: vertical;

      padding: 14px;

      border: 1px solid #d9d9d9;
      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      outline: none;

      background: white;
    }

    textarea:focus {
      border-color: #5b4bdb;
    }

    .rodape {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 10px;
    }

    .contador {
      font-size: 12px;
      color: #888;
    }

    button {
      border: none;

      border-radius: 8px;

      padding: 10px 18px;

      background: #21145f;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem {
      margin-top: 10px;

      font-size: 13px;

      font-weight: bold;
    }

    #envio {
      display: none;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="titulo">
      💡 Tem uma sugestão?
    </div>

    <div class="subtitulo">
      Escreva sua sugestão abaixo e envie para nós.
    </div>

    <form
  id="formulario"
  method="POST"
  action="https://script.google.com/a/macros/latam.com/s/AKfycbyh-t9jOQSH_VepJkA5rpr0MxQ8zIR88tVr34YH1kejIfyuOBKNVaOMYK6pXT7jtjcS/exec"
  target="envio"
>

      <textarea
        id="sugestao"
        name="sugestao"
        maxlength="1000"
        placeholder="Digite sua sugestão aqui..."
        required
      ></textarea>

      <div class="rodape">

        <div
          class="contador"
          id="contador"
        >
          0 / 1000
        </div>

        <button
          type="submit"
          id="botao"
        >
          Enviar sugestão
        </button>

      </div>

    </form>

    <iframe
      name="envio"
      id="envio"
    ></iframe>

    <div id="mensagem"></div>

  </div>


  <script>

    const formulario =
      document.getElementById('formulario');

    const campo =
      document.getElementById('sugestao');

    const contador =
      document.getElementById('contador');

    const botao =
      document.getElementById('botao');

    const mensagem =
      document.getElementById('mensagem');


    campo.addEventListener(
      'input',
      function() {

        contador.textContent =
          campo.value.length + ' / 1000';

      }
    );


    formulario.addEventListener(
      'submit',
      function() {

        botao.disabled = true;

        botao.textContent =
          'Enviando...';

        mensagem.textContent = '';

        setTimeout(
          function() {

            campo.value = '';

            contador.textContent =
              '0 / 1000';

            botao.disabled = false;

            botao.textContent =
              'Enviar sugestão';

            mensagem.textContent =
              'Sugestão enviada com sucesso!';

          },
          1200
        );

      }
    );


    window.addEventListener(
      'message',
      function(event) {

        if (
          event.data ===
          'sugestao_enviada'
        ) {

          campo.value = '';

          contador.textContent =
            '0 / 1000';

          botao.disabled = false;

          botao.textContent =
            'Enviar sugestão';

          mensagem.textContent =
            'Sugestão enviada com sucesso!';

        }

      }
    );

  </script>

</body>

</html>
