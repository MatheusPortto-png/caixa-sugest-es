<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Caixa de Sugestões</title>

  <style>

  /* =====================================================
     CONFIGURAÇÃO GERAL
     ===================================================== */

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;

    /* IMPORTANTE:
       deixa o fundo transparente para aparecer
       o fundo original do Looker Studio */
    background: transparent;

    color: #17005c;
  }


  /* =====================================================
     CONTAINER PRINCIPAL
     ===================================================== */

  .container {
    width: 100%;
    height: 100%;

    padding: 12px 16px 14px;

    display: flex;
    flex-direction: column;

    background: transparent;
  }


  /* =====================================================
     CABEÇALHO "SUGESTÕES"
     ===================================================== */

  .cabecalho {
    position: relative;

    width: 72%;
    min-width: 190px;

    height: 42px;

    display: flex;
    align-items: center;

    padding-left: 22px;

    margin-bottom: 15px;

    background: #17005c;

    border-radius: 22px;

    color: white;

    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;

    overflow: visible;
  }


  /* detalhe rosa do cabeçalho */

  .cabecalho::after {
    content: "";

    position: absolute;

    top: 0;
    right: -5px;

    width: 13px;
    height: 42px;

    background: #d50050;

    border-radius: 0 22px 22px 0;

    z-index: -1;
  }


  /* =====================================================
     TÍTULO
     ===================================================== */

  .titulo {
    display: flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 4px;

    color: #17005c;

    font-size: 18px;
    font-weight: 700;

    line-height: 1.2;
  }


  .titulo .icone {
    font-size: 19px;

    line-height: 1;
  }


  /* =====================================================
     SUBTÍTULO
     ===================================================== */

  .subtitulo {
    margin-bottom: 10px;

    color: #555;

    font-size: 12px;

    line-height: 1.25;
  }


  /* =====================================================
     ÁREA DO TEXTAREA
     ===================================================== */

  textarea {
    width: 100%;

    flex: 1;

    min-height: 80px;

    resize: none;

    padding: 12px 13px;

    border: 1px solid rgba(23, 0, 92, 0.15);

    border-radius: 10px;

    outline: none;

    background: rgba(255, 255, 255, 0.55);

    color: #333;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 12px;

    line-height: 1.4;

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      background 0.2s ease;
  }


  textarea::placeholder {
    color: #888;
  }


  textarea:focus {
    border-color: #17005c;

    background: rgba(255, 255, 255, 0.75);

    box-shadow:
      0 0 0 2px rgba(23, 0, 92, 0.08);
  }


  /* =====================================================
     RODAPÉ
     ===================================================== */

  .rodape {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-top: 10px;
  }


  /* =====================================================
     CONTADOR
     ===================================================== */

  .contador {
    color: #777;

    font-size: 10px;

    white-space: nowrap;
  }


  /* =====================================================
     BOTÃO
     ===================================================== */

  button {
    position: relative;

    border: none;

    border-radius: 9px;

    padding: 9px 17px;

    background: #17005c;

    color: white;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;

    white-space: nowrap;

    transition:
      transform 0.15s ease,
      opacity 0.15s ease;
  }


  /* detalhe rosa no botão */

  button::after {
    content: "";

    position: absolute;

    right: -3px;
    top: 5px;

    width: 4px;
    height: calc(100% - 10px);

    background: #d50050;

    border-radius: 0 5px 5px 0;
  }


  button:hover {
    opacity: 0.92;

    transform: translateY(-1px);
  }


  button:active {
    transform: translateY(0);
  }


  button:disabled {
    opacity: 0.55;

    cursor: wait;

    transform: none;
  }


  /* =====================================================
     MENSAGEM DE ENVIO
     ===================================================== */

  #mensagem {
    min-height: 14px;

    margin-top: 5px;

    color: #17005c;

    font-size: 10px;

    font-weight: 600;
  }


  /* =====================================================
     IFRAME INVISÍVEL
     ===================================================== */

  #envio {
    display: none;
  }

</style>

</head>

<body>

  <div class="container">

  <div class="cabecalho">
    SUGESTÕES
  </div>

  <div class="titulo">
    <span class="icone">💡</span>
    <span>Tem uma sugestão?</span>
  </div>

  <div class="subtitulo">
    Escreva sua sugestão abaixo e envie para nós.
  </div>

    <form
  id="formulario"
  method="POST"
  action="https://script.google.com/a/macros/latam.com/s/AKfycbyh-t9jOQSH_VepJkA5rpr0MxQ8zIR88tVr34YH1kejIfyuOBKNVaOMYK6pXT7jtjcS/exec"
  target="envio"
>

      <textarea
        id="sugestao"
        name="sugestao"
        maxlength="1000"
        placeholder="Digite sua sugestão aqui..."
        required
      ></textarea>

      <div class="rodape">

        <div
          class="contador"
          id="contador"
        >
          0 / 1000
        </div>

        <button
          type="submit"
          id="botao"
        >
          Enviar sugestão
        </button>

      </div>

    </form>

    <iframe
      name="envio"
      id="envio"
    ></iframe>

    <div id="mensagem"></div>

  </div>


  <script>

    const formulario =
      document.getElementById('formulario');

    const campo =
      document.getElementById('sugestao');

    const contador =
      document.getElementById('contador');

    const botao =
      document.getElementById('botao');

    const mensagem =
      document.getElementById('mensagem');


    campo.addEventListener(
      'input',
      function() {

        contador.textContent =
          campo.value.length + ' / 1000';

      }
    );


    formulario.addEventListener(
      'submit',
      function() {

        botao.disabled = true;

        botao.textContent =
          'Enviando...';

        mensagem.textContent = '';

        setTimeout(
          function() {

            campo.value = '';

            contador.textContent =
              '0 / 1000';

            botao.disabled = false;

            botao.textContent =
              'Enviar sugestão';

            mensagem.textContent =
              'Sugestão enviada com sucesso!';

          },
          1200
        );

      }
    );


    window.addEventListener(
      'message',
      function(event) {

        if (
          event.data ===
          'sugestao_enviada'
        ) {

          campo.value = '';

          contador.textContent =
            '0 / 1000';

          botao.disabled = false;

          botao.textContent =
            'Enviar sugestão';

          mensagem.textContent =
            'Sugestão enviada com sucesso!';

        }

      }
    );

  </script>

</body>

</html>
