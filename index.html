<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Caixa de Sugestões</title>

  <style>

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: Arial, sans-serif;
    background: transparent;
  }

  .container {
    width: 100%;
    height: 100%;
    padding: 18px;
    display: flex;
    flex-direction: column;
  }

  .titulo {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 5px;
    color: #1f1f1f;
  }

  .subtitulo {
    font-size: 13px;
    color: #666;
    margin-bottom: 12px;
  }

  textarea {
    width: 100%;
    flex: 1;

    min-height: 90px;

    resize: none;

    padding: 12px;

    border: 1px solid #d9d9d9;
    border-radius: 10px;

    font-family: Arial, sans-serif;
    font-size: 13px;

    color: #333;

    background: #ffffff;

    outline: none;

    transition: border-color 0.2s,
                box-shadow 0.2s;
  }

  textarea::placeholder {
    color: #999;
  }

  textarea:focus {
    border-color: #21145f;

    box-shadow:
      0 0 0 2px rgba(33, 20, 95, 0.08);
  }

  .rodape {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 10px;
  }

  .contador {
    font-size: 11px;
    color: #999;
  }

  button {
    border: none;

    border-radius: 8px;

    padding: 9px 16px;

    background: #21145f;

    color: white;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;

    transition:
      transform 0.15s,
      opacity 0.15s;
  }

  button:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  button:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
  }

  #mensagem {
    min-height: 16px;

    margin-top: 6px;

    font-size: 12px;

    font-weight: 600;

    color: #21145f;
  }

  #envio {
    display: none;
  }

</style>

</head>

<body>

  <div class="container">

    <div class="titulo">
      💡 Tem uma sugestão?
    </div>

    <div class="subtitulo">
      Escreva sua sugestão abaixo e envie para nós.
    </div>

    <form
  id="formulario"
  method="POST"
  action="https://script.google.com/a/macros/latam.com/s/AKfycbyh-t9jOQSH_VepJkA5rpr0MxQ8zIR88tVr34YH1kejIfyuOBKNVaOMYK6pXT7jtjcS/exec"
  target="envio"
>

      <textarea
        id="sugestao"
        name="sugestao"
        maxlength="1000"
        placeholder="Digite sua sugestão aqui..."
        required
      ></textarea>

      <div class="rodape">

        <div
          class="contador"
          id="contador"
        >
          0 / 1000
        </div>

        <button
          type="submit"
          id="botao"
        >
          Enviar sugestão
        </button>

      </div>

    </form>

    <iframe
      name="envio"
      id="envio"
    ></iframe>

    <div id="mensagem"></div>

  </div>


  <script>

    const formulario =
      document.getElementById('formulario');

    const campo =
      document.getElementById('sugestao');

    const contador =
      document.getElementById('contador');

    const botao =
      document.getElementById('botao');

    const mensagem =
      document.getElementById('mensagem');


    campo.addEventListener(
      'input',
      function() {

        contador.textContent =
          campo.value.length + ' / 1000';

      }
    );


    formulario.addEventListener(
      'submit',
      function() {

        botao.disabled = true;

        botao.textContent =
          'Enviando...';

        mensagem.textContent = '';

        setTimeout(
          function() {

            campo.value = '';

            contador.textContent =
              '0 / 1000';

            botao.disabled = false;

            botao.textContent =
              'Enviar sugestão';

            mensagem.textContent =
              'Sugestão enviada com sucesso!';

          },
          1200
        );

      }
    );


    window.addEventListener(
      'message',
      function(event) {

        if (
          event.data ===
          'sugestao_enviada'
        ) {

          campo.value = '';

          contador.textContent =
            '0 / 1000';

          botao.disabled = false;

          botao.textContent =
            'Enviar sugestão';

          mensagem.textContent =
            'Sugestão enviada com sucesso!';

        }

      }
    );

  </script>

</body>

</html>
