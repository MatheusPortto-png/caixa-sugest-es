<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Caixa de Sugestões</title>

  <style>

    /* =====================================================
       FUNDO
       ===================================================== */

    html {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      background: transparent !important;
    }


    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #e5e5f4 !important;
    }


    * {
      box-sizing: border-box;
    }


    /* =====================================================
       CONTAINER
       ===================================================== */

    .container {
      width: 100%;
      height: 100%;

      margin: 0;

      padding: 10px 16px 12px;

      display: flex;
      flex-direction: column;

      background: #e5e5f4 !important;
    }


    /* =====================================================
       FAIXA "SUGESTÕES"
       ===================================================== */

    .cabecalho {
      position: relative;

      width: 72%;
      height: 34px;

      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding-left: 22px;

      margin-bottom: 14px;

      background: #17005c;

      border-radius: 20px;

      color: #ffffff;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 15px;
      font-weight: 700;

      text-transform: uppercase;

      box-shadow: 5px 0 0 #d50050;
    }


    /* =====================================================
       TÍTULO
       ===================================================== */

    .titulo {
      display: flex;
      align-items: center;

      gap: 7px;

      margin: 0 0 4px 0;

      color: #17005c;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 18px;
      font-weight: 700;

      line-height: 1.15;
    }


    .titulo .icone {
      display: flex;
      align-items: center;

      font-size: 18px;

      line-height: 1;
    }


    /* =====================================================
       SUBTÍTULO
       ===================================================== */

    .subtitulo {
      margin: 0 0 10px 0;

      color: #555555;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      line-height: 1.2;
    }


    /* =====================================================
       FORMULÁRIO
       ===================================================== */

    #formulario {
      width: 100%;

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;
    }


    /* =====================================================
       CAIXA DE TEXTO
       ===================================================== */

    textarea {
      width: 100%;

      flex: 1;

      min-height: 70px;

      resize: none;

      padding: 12px 13px;

      border: 1px solid #d8d5e4;

      border-radius: 10px;

      outline: none;

      background: rgba(255, 255, 255, 0.35) !important;

      color: #333333;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      line-height: 1.4;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }


    textarea::placeholder {
      color: #888888;
    }


    textarea:focus {
      border-color: #17005c;

      background: rgba(255, 255, 255, 0.55) !important;

      box-shadow:
        0 0 0 2px rgba(23, 0, 92, 0.08);
    }


    /* =====================================================
       RODAPÉ
       ===================================================== */

    .rodape {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-top: 10px;

      flex-shrink: 0;
    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    .contador {
      color: #666666;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;

      white-space: nowrap;
    }


    /* =====================================================
       BOTÃO
       ===================================================== */

    button {
      position: relative;

      border: none;

      border-radius: 9px;

      padding: 9px 17px;

      background: #17005c;

      color: #ffffff;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

      white-space: nowrap;

      box-shadow: 4px 0 0 #d50050;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    button:hover {
      opacity: 0.92;

      transform: translateY(-1px);
    }


    button:active {
      transform: translateY(0);
    }


    button:disabled {
      opacity: 0.55;

      cursor: wait;

      transform: none;
    }


    /* =====================================================
       MENSAGEM
       ===================================================== */

    #mensagem {
      min-height: 14px;

      margin-top: 4px;

      color: #17005c;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;

      font-weight: 600;
    }


    /* =====================================================
       IFRAME INVISÍVEL
       ===================================================== */

    #envio {
      display: none;
    }

  </style>

</head>


<body>

  <div class="container">


    <!-- =================================================
         CABEÇALHO
         ================================================= -->

    <div
      class="cabecalho"
      id="cabecalho"
    >
      SUGESTÕES
    </div>


    <!-- =================================================
         TÍTULO
         ================================================= -->

    <div class="titulo">

      <span class="icone">
        💡
      </span>

      <span id="titulo">
        Tem uma sugestão?
      </span>

    </div>


    <!-- =================================================
         SUBTÍTULO
         ================================================= -->

    <div
      class="subtitulo"
      id="subtitulo"
    >
      Escreva sua sugestão abaixo e envie para nós.
    </div>


    <!-- =================================================
         FORMULÁRIO
         ================================================= -->

    <form
      id="formulario"
      method="POST"
      action="https://script.google.com/a/macros/latam.com/s/AKfycbyh-t9jOQSH_VepJkA5rpr0MxQ8zIR88tVr34YH1kejIfyuOBKNVaOMYK6pXT7jtjcS/exec"
      target="envio"
    >


      <textarea
        id="sugestao"
        name="sugestao"
        maxlength="1000"
        placeholder="Digite sua sugestão aqui..."
        required
      ></textarea>


      <div class="rodape">


        <div
          class="contador"
          id="contador"
        >
          0 / 1000
        </div>


        <button
          type="submit"
          id="botao"
        >
          Enviar sugestão
        </button>


      </div>

    </form>


    <!-- =================================================
         IFRAME
         ================================================= -->

    <iframe
      name="envio"
      id="envio"
    ></iframe>


    <!-- =================================================
         MENSAGEM
         ================================================= -->

    <div
      id="mensagem"
    ></div>


  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const formulario =
      document.getElementById('formulario');

    const campo =
      document.getElementById('sugestao');

    const contador =
      document.getElementById('contador');

    const botao =
      document.getElementById('botao');

    const mensagem =
      document.getElementById('mensagem');

    const cabecalho =
      document.getElementById('cabecalho');

    const titulo =
      document.getElementById('titulo');

    const subtitulo =
      document.getElementById('subtitulo');


    /* =====================================================
       IDIOMAS
       ===================================================== */

    const idiomas = {

      pt: {

        cabecalho:
          'SUGESTÕES',

        titulo:
          'Tem uma sugestão?',

        subtitulo:
          'Escreva sua sugestão abaixo e envie para nós.',

        placeholder:
          'Digite sua sugestão aqui...',

        enviar:
          'Enviar sugestão',

        enviando:
          'Enviando...',

        sucesso:
          'Sugestão enviada com sucesso!'

      },


      es: {

        cabecalho:
          'SUGERENCIAS',

        titulo:
          '¿Tienes una sugerencia?',

        subtitulo:
          'Escribe tu sugerencia a continuación y envíanosla.',

        placeholder:
          'Escribe tu sugerencia aquí...',

        enviar:
          'Enviar sugerencia',

        enviando:
          'Enviando...',

        sucesso:
          '¡Sugerencia enviada correctamente!'

      },


      en: {

        cabecalho:
          'SUGGESTIONS',

        titulo:
          'Have a suggestion?',

        subtitulo:
          'Write your suggestion below and send it to us.',

        placeholder:
          'Type your suggestion here...',

        enviar:
          'Submit suggestion',

        enviando:
          'Sending...',

        sucesso:
          'Suggestion sent successfully!'

      }

    };


    /* =====================================================
       DESCOBRIR IDIOMA PELA URL
       ===================================================== */

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    let idiomaAtual =
      parametros.get('lang');


    /* =====================================================
       IDIOMA PADRÃO
       ===================================================== */

    if (
      !idiomaAtual ||
      !idiomas[idiomaAtual]
    ) {

      idiomaAtual = 'pt';

    }


    const texto =
      idiomas[idiomaAtual];


    /* =====================================================
       APLICAR IDIOMA
       ===================================================== */

    document.documentElement.lang =
      idiomaAtual === 'pt'
        ? 'pt-BR'
        : idiomaAtual;


    cabecalho.textContent =
      texto.cabecalho;


    titulo.textContent =
      texto.titulo;


    subtitulo.textContent =
      texto.subtitulo;


    campo.placeholder =
      texto.placeholder;


    botao.textContent =
      texto.enviar;


    /* =====================================================
       CONTADOR
       ===================================================== */

    campo.addEventListener(
      'input',
      function() {

        contador.textContent =
          campo.value.length + ' / 1000';

      }
    );


    /* =====================================================
       ENVIO
       ===================================================== */

    formulario.addEventListener(
      'submit',
      function() {

        botao.disabled = true;

        botao.textContent =
          texto.enviando;

        mensagem.textContent = '';


        setTimeout(
          function() {

            campo.value = '';

            contador.textContent =
              '0 / 1000';

            botao.disabled = false;

            botao.textContent =
              texto.enviar;

            mensagem.textContent =
              texto.sucesso;

          },
          1200
        );

      }
    );


    /* =====================================================
       RESPOSTA DO APPS SCRIPT
       ===================================================== */

    window.addEventListener(
      'message',
      function(event) {

        if (
          event.data ===
          'sugestao_enviada'
        ) {

          campo.value = '';

          contador.textContent =
            '0 / 1000';

          botao.disabled = false;

          botao.textContent =
            texto.enviar;

          mensagem.textContent =
            texto.sucesso;

        }

      }
    );


  </script>

</body>

</html>
